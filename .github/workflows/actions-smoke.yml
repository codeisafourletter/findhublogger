name: Actions smoke

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-smoke.yml"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependency
        working-directory: cloud
        run: npm install --omit=dev --no-audit --no-fund
      - name: Check collector syntax
        working-directory: cloud
        run: node --check run-once.mjs
      - name: Verify runner Chrome
        working-directory: cloud
        run: node --input-type=module -e 'import { chromium } from "playwright-core"; const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true, args: ["--no-sandbox"] }); const page = await browser.newPage(); await page.goto("data:text/html,ok"); await browser.close(); console.log("runner chrome ok");'
      - name: Update heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit 4 --repo "$GITHUB_REPOSITORY" --body "Runtime smoke $GITHUB_EVENT_NAME: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
