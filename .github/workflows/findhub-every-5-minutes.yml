name: Find Hub collector

"on":
  workflow_dispatch: {}
  schedule:
    # Offset from the top of the minute to reduce GitHub scheduler congestion.
    - cron: "2/5 * * * *"

permissions:
  contents: read

concurrency:
  group: findhub-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore encrypted rolling auth state
        uses: actions/cache@v6
        with:
          path: cloud/.auth/auth-state.enc
          key: findhub-auth-${{ vars.AUTH_STATE_EPOCH }}-${{ github.run_id }}
          restore-keys: |
            findhub-auth-${{ vars.AUTH_STATE_EPOCH }}-
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Collect Find Hub location
        run: node run-once.mjs
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          AUTH_STATE_KEY_B64: ${{ secrets.AUTH_STATE_KEY_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TARGET_PERSON: Meme
          CHROME_BIN: /usr/bin/google-chrome
