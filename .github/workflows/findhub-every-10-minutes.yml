name: Find Hub every 5 minutes

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/findhub-every-10-minutes.yml"

permissions:
  contents: read

concurrency:
  group: findhub-collector-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Check collector syntax
        run: node --check run-once.mjs
      - name: Verify runner Chrome
        run: node --input-type=module -e 'import { chromium } from "playwright-core"; const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true, args: ["--no-sandbox"] }); const page = await browser.newPage(); await page.goto("data:text/html,ok"); await browser.close(); console.log("runner chrome ok");'

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node run-once.mjs
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TARGET_PERSON: Meme
          CHROME_BIN: /usr/bin/google-chrome
