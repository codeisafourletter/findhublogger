name: Find Hub collector

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: read

concurrency:
  group: findhub-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Collect Find Hub location
        run: node run-once.mjs
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TARGET_PERSON: Meme
          CHROME_BIN: /usr/bin/google-chrome
