name: Find Hub every 5 minutes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: findhub-collector-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
        run: |
          missing=0
          for name in AUTH_STATE_B64 SHEET_ENDPOINT SHEET_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22

      - name: Install diagnostic dependencies
        if: github.event_name == 'pull_request'
        working-directory: cloud
        run: npm install --omit=dev --no-audit --no-fund

      - name: Install Chromium for diagnostic
        if: github.event_name == 'pull_request'
        working-directory: cloud
        run: npx playwright install --with-deps chromium

      - name: Run non-writing collector diagnostic
        if: github.event_name == 'pull_request'
        working-directory: cloud
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TARGET_PERSON: Meme
        run: node diagnose.mjs

  collect:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node run-once.mjs
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TARGET_PERSON: Meme
