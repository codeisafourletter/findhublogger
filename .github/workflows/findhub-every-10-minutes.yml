name: Find Hub every 5 minutes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findhub-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: node run-once.mjs
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TARGET_PERSON: Meme
